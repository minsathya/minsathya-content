    <style>
        /* Modern Native App Token System */
        :root {
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            
            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #8a9990;
            --panel-bg: #121212;
            --panel-border: #222222;
            --row-divider: #1c1c1c;
            --row-hover: rgba(255, 255, 255, 0.015);

            --accent-green: #a2e0a0;
            --bar-track: #1c241e;
            --active-line-color: #ffffff;
            
            --cascade-distance: 24px;
            --cascade-duration-exit: 0.2s;
            --cascade-duration-entry: 0.28s;
        }

        body.light-mode {
            --bg-color: #ebebe4;
            --text-main: #111111;
            --text-muted: #555555;
            --panel-bg: #ffffff;
            --panel-border: #e2e2e7;
            --row-divider: #f2f2f7;
            --row-hover: rgba(0, 0, 0, 0.01);

            --accent-green: #257a6c;
            --bar-track: #d8e4dc;
            --active-line-color: #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Native Device Stock Fonts */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 16px 12px 40px 12px;
            width: 100%;
            max-width: 100vw;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* MASTER ENTRANCE ANIMATIONS */
        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 24px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .day-switcher-capsule, .day-stage-wrapper, .contents-container > .wide-capsule {
            opacity: 1;
            animation: masterEntrance 0.8s var(--ease-smooth) backwards;
        }
 
        .day-switcher-capsule { animation-delay: 0.10s; }
        .day-stage-wrapper { animation-delay: 0.14s; }
        .contents-container > .wide-capsule:nth-of-type(1) { animation-delay: 0.18s; }
        .contents-container > .wide-capsule:nth-of-type(2) { animation-delay: 0.22s; }
        .contents-container > .wide-capsule:nth-of-type(3) { animation-delay: 0.26s; }
        .contents-container > .wide-capsule:nth-of-type(4) { animation-delay: 0.30s; }
        .contents-container > .wide-capsule:nth-of-type(5) { animation-delay: 0.34s; }
        .contents-container > .wide-capsule:nth-of-type(6) { animation-delay: 0.38s; }

        /* DAY SWITCHER CAPSULE */
        .day-switcher-capsule {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 50px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            position: relative;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            scrollbar-width: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        .day-switcher-capsule::-webkit-scrollbar {
            display: none;
        }

        .day-pill {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 500;
            padding: 8px 14px;
            cursor: pointer;
            transition: color 0.4s var(--ease-smooth), transform 0.2s var(--ease-smooth);
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .day-pill:active {
            transform: scale(0.92);
        }

        .day-pill:hover, .day-pill.active {
            color: var(--text-main);
            font-weight: 600;
        }

        .day-active-line {
            position: absolute;
            bottom: 6px;
            height: 3px;
            border-radius: 3px;
            background-color: var(--active-line-color);
            transition: left 0.38s var(--ease-premium), width 0.38s var(--ease-premium), background-color 0.8s var(--ease-smooth);
            z-index: 1;
            pointer-events: none;
        }

        .contents-container { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; width: 100%; }

        /* STACK CONTAINER */
        .day-stage-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto;
            width: 100%;
            position: relative;
        }

        /* CARD SLIDES LOCKED IN SINGLE GRID CELL */
        .day-card-slide {
            grid-area: 1 / 1;
            width: 100%;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.3s var(--ease-smooth);
        }

        .day-card-slide.is-active {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
            transform: translate3d(0, 0, 0);
            z-index: 2;
        }

        /* FULL VIEWPORT OFF-SCREEN GLIDE ANIMATIONS */
        @keyframes exitToLeft {
            0% { transform: translate3d(0, 0, 0); opacity: 1; }
            100% { transform: translate3d(-100vw, 0, 0); opacity: 0; }
        }

        @keyframes exitToRight {
            0% { transform: translate3d(0, 0, 0); opacity: 1; }
            100% { transform: translate3d(100vw, 0, 0); opacity: 0; }
        }

        @keyframes enterFromRight {
            0% { transform: translate3d(100vw, 0, 0); opacity: 0; }
            100% { transform: translate3d(0, 0, 0); opacity: 1; }
        }

        @keyframes enterFromLeft {
            0% { transform: translate3d(-100vw, 0, 0); opacity: 0; }
            100% { transform: translate3d(0, 0, 0); opacity: 1; }
        }

        .slide-exit-left {
            animation: exitToLeft 0.28s cubic-bezier(0.4, 0, 1, 1) forwards !important;
            visibility: visible !important;
            z-index: 1 !important;
        }

        .slide-exit-right {
            animation: exitToRight 0.28s cubic-bezier(0.4, 0, 1, 1) forwards !important;
            visibility: visible !important;
            z-index: 1 !important;
        }

        .slide-enter-right {
            animation: enterFromRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            visibility: visible !important;
            pointer-events: auto !important;
            z-index: 3 !important;
        }

        .slide-enter-left {
            animation: enterFromLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            visibility: visible !important;
            pointer-events: auto !important;
            z-index: 3 !important;
        }

        /* WIDE CAPSULES */
        .wide-capsule {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 22px 18px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
            background-clip: padding-box;
            overflow: hidden;
            isolation: isolate;
            transition: transform 0.45s var(--ease-premium), 
                        box-shadow 0.45s var(--ease-premium), 
                        border-color 0.45s var(--ease-smooth),
                        background-color 0.8s var(--ease-smooth);
        }

        body.light-mode .wide-capsule {
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
        }

        @media (hover: hover) and (pointer: fine) {
            .wide-capsule:hover { 
                border-color: rgba(255, 255, 255, 0.15); 
                transform: translate3d(0, -5px, 0) scale3d(1.01, 1.01, 1);
                box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
            }
            body.light-mode .wide-capsule:hover { 
                border-color: #b8b8bc; 
                box-shadow: 0 18px 36px rgba(0, 0, 0, 0.12); 
            }
        }

        .capsule-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .capsule-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.2;
            transition: color 0.8s var(--ease-smooth);
        }

        /* INLINE IMAGE ICON ENGINE */
        .capsule-svg-icon, .capsule-icon {
            width: 32px !important;
            height: 32px !important;
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .icon-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* GRID FOR FOOD ITEMS */
        .food-checklist-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-flow: column;
            grid-template-rows: repeat(7, auto);
            gap: 12px 16px;
            width: 100%;
        }

        .macros-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-flow: column;
            gap: 16px 20px;
            width: 100%;
        }

        #macroGrid { grid-template-rows: repeat(4, auto); }        
        #fatsGrid { grid-template-rows: repeat(4, auto); }        
        #carotenoidsGrid { grid-template-rows: repeat(1, auto); } 
        #vitaminsGrid { grid-template-rows: repeat(7, auto); }    
        #macroMineralsGrid { grid-template-rows: repeat(4, auto); }
        #traceMineralsGrid { grid-template-rows: repeat(5, auto); }

        .food-item-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--row-divider);
            padding: 12px 14px;
            border-radius: 16px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s var(--ease-smooth), border-color 0.2s var(--ease-smooth), transform 0.1s var(--ease-smooth);
            width: 100%;
        }

        /* TACTILE RECOIL ON TOUCH FOR FOOD ROWS */
        .food-item-checkbox:active {
            transform: scale(0.985);
            background-color: rgba(255, 255, 255, 0.06);
        }

        .food-item-checkbox input[type="checkbox"] { display: none; }

        .custom-check-box {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.25s var(--ease-smooth), border-color 0.25s var(--ease-smooth), transform 0.2s var(--ease-smooth);
            flex-shrink: 0;
        }

        .custom-check-box svg { 
            width: 12px; 
            height: 12px; 
            stroke: #0b0b0b; 
            stroke-width: 3; 
            fill: none; 
            opacity: 0; 
            transform: scale(0.3);
            transition: opacity 0.25s var(--ease-smooth), transform 0.25s var(--ease-smooth); 
        }

        .food-item-checkbox input:checked + .custom-check-box,
        .custom-check-box.checked {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .food-item-checkbox input:checked + .custom-check-box svg,
        .custom-check-box.checked svg { 
            opacity: 1; 
            transform: scale(1);
        }

        .food-name { font-size: 14.5px; font-weight: 500; color: var(--text-main); transition: color 0.8s var(--ease-smooth); }
        .food-qty { font-size: 12.5px; color: var(--text-muted); margin-left: 4px; transition: color 0.8s var(--ease-smooth); }

        /* MACROS & NUTRIENTS PROGRESS CARDS */
        .macro-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .macro-top-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-main);
            height: 24px;
            line-height: 1;
            transition: color 0.8s var(--ease-smooth);
        }

        .macro-val { color: var(--text-muted); font-size: 12px; transition: color 0.8s var(--ease-smooth); }
        
        .macro-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            min-width: 36px;
            height: 20px;
            position: relative;
            overflow: hidden;
            transition: background-color 0.35s var(--ease-smooth), 
                        color 0.35s var(--ease-smooth), 
                        min-width 0.35s var(--ease-smooth),
                        width 0.35s var(--ease-smooth),
                        padding 0.35s var(--ease-smooth),
                        border-radius 0.35s var(--ease-smooth);
        }

        .badge-txt-span {
            display: inline-block;
            white-space: nowrap;
            opacity: 1;
            transform: scale(1);
            max-width: 50px;
            clip-path: inset(0 0 0 0);
            transition: opacity 0.25s var(--ease-smooth),
                        transform 0.35s var(--ease-smooth),
                        max-width 0.35s var(--ease-smooth),
                        clip-path 0.35s var(--ease-smooth);
        }

        .badge-tick-svg {
            width: 0px;
            height: 12px;
            stroke: #ffffff;
            stroke-width: 3.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.25s var(--ease-smooth),
                        transform 0.35s var(--ease-smooth),
                        width 0.35s var(--ease-smooth);
            flex-shrink: 0;
        }

        .badge-warn-img {
            width: 0px;
            height: 15px;
            object-fit: contain;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.25s var(--ease-smooth),
                        transform 0.35s var(--ease-smooth),
                        width 0.35s var(--ease-smooth);
            flex-shrink: 0;
        }

        .macro-badge.completed-badge {
            min-width: 20px !important;
            width: 20px !important;
            height: 20px !important;
            border-radius: 50% !important;
            padding: 0 !important;
        }

        .macro-badge.completed-badge .badge-txt-span {
            opacity: 0;
            transform: scale(0.5);
            max-width: 0px;
            clip-path: inset(0 0 0 100%);
        }

        .macro-badge.completed-badge .badge-tick-svg {
            opacity: 1;
            transform: scale(1);
            width: 12px;
        }

        .macro-badge.warning-badge {
            min-width: 20px !important;
            width: 20px !important;
            height: 20px !important;
            border-radius: 50% !important;
            padding: 0 !important;
            background-color: transparent !important;
        }

        .macro-badge.warning-badge .badge-txt-span {
            opacity: 0;
            transform: scale(0.5);
            max-width: 0px;
            clip-path: inset(0 0 0 100%);
        }

        .macro-badge.warning-badge .badge-warn-img {
            opacity: 1;
            transform: scale(1);
            width: 20px;
            height: 20px;
        }

        .progress-track {
            height: 7px;
            background-color: var(--bar-track);
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            transition: background-color 0.8s var(--ease-smooth);
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            width: 100%;
            transform-origin: left center;
            transform: scaleX(0);
            will-change: transform;
            transition: transform 0.8s var(--ease-smooth), background-color 0.4s var(--ease-smooth);
        }

        @media (max-width: 1024px) {
            .food-checklist-grid, .macros-grid {
                grid-template-columns: 1fr !important;
                grid-auto-flow: row !important;
                grid-template-rows: none !important;
            }
        }
    </style>
</head>

    <main class="contents-container">

        <!-- DAY SWITCHER -->
        <div class="day-switcher-capsule" id="daySwitcher">
            <button class="day-pill" data-day="0">Sun</button>
            <button class="day-pill" data-day="1">Mon</button>
            <button class="day-pill" data-day="2">Tue</button>
            <button class="day-pill" data-day="3">Wed</button>
            <button class="day-pill" data-day="4">Thu</button>
            <button class="day-pill" data-day="5">Fri</button>
            <button class="day-pill" data-day="6">Sat</button>
